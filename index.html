<!DOCTYPE html>
<html>
<head>
    <title>My School Website</title>
    <style>
        body {
            background: linear-gradient(to right, #ff9a9e, #fad0c4, #fff59d, #a5d6a7, #81d4fa, #ce93d8);
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        .top-bar {
            background: linear-gradient(to right, red, orange, yellow, green, blue, purple);
            color: white;
            text-align: center;
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 1px 1px black;
        }

        .container {
            width: 88%;
            margin: 25px auto;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 25px;
            border: 6px solid #ff4081;
            box-shadow: 0px 0px 30px #ff80ab;
        }

        h1 {
            color: #e91e63;
            text-align: center;
            font-size: 50px;
            text-shadow: 3px 3px #ffeb3b;
            background-color: #fff9c4;
            padding: 15px;
            border-radius: 20px;
            border: 3px dashed #ff9800;
        }

        .motto {
            text-align: center;
            color: #7b1fa2;
            font-size: 22px;
            font-style: italic;
            font-weight: bold;
            background-color: #e1bee7;
            padding: 10px;
            border-radius: 10px;
        }

        .welcome-box {
            background: linear-gradient(to right, #bbdefb, #c8e6c9, #fff9c4, #ffccbc);
            border: 4px solid #2196f3;
            padding: 25px;
            border-radius: 20px;
            text-align: center;
        }

        h2 {
            color: white;
            font-size: 30px;
            padding: 12px;
            border-radius: 10px;
        }

        .h2-blue { background-color: #2196f3; }
        .h2-green { background-color: #43a047; }
        .h2-purple { background-color: #8e24aa; }
        .h2-orange { background-color: #ff6d00; }
        .h2-pink { background-color: #ec407a; }

        p {
            font-size: 19px;
            color: #37474f;
            line-height: 1.8;
        }

        .pink-p { background-color: #fce4ec; padding: 15px; border-radius: 12px; border-left: 8px solid #e91e63; }
        .blue-p { background-color: #e3f2fd; padding: 15px; border-radius: 12px; border-left: 8px solid #2196f3; }
        .green-p { background-color: #e8f5e9; padding: 15px; border-radius: 12px; border-left: 8px solid #43a047; }
        .yellow-p { background-color: #fffde7; padding: 15px; border-radius: 12px; border-left: 8px solid #fdd835; }

        .subjects {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .card {
            border-radius: 18px;
            padding: 18px;
            width: 180px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: #263238;
            border: 3px solid white;
            box-shadow: 3px 3px 10px #bdbdbd;
        }

        .c1 { background-color: #ffccbc; }
        .c2 { background-color: #fff9c4; }
        .c3 { background-color: #c8e6c9; }
        .c4 { background-color: #bbdefb; }
        .c5 { background-color: #e1bee7; }
        .c6 { background-color: #ffecb3; }

        .card span {
            font-size: 40px;
            display: block;
        }

        .activities {
            background: linear-gradient(to right, #c8e6c9, #fff9c4);
            padding: 20px;
            border-radius: 18px;
            border: 3px solid #43a047;
        }

        .activities ul {
            font-size: 19px;
            line-height: 2;
            color: #1b5e20;
        }

        .love-box {
            background-color: #f3e5f5;
            border: 3px dotted #8e24aa;
            padding: 20px;
            border-radius: 18px;
        }

        .big-star {
            text-align: center;
            font-size: 32px;
            letter-spacing: 8px;
            background-color: #ffecb3;
            padding: 10px;
            border-radius: 15px;
        }

        .footer {
            background: linear-gradient(to right, #e91e63, #ff9800, #2196f3, #43a047);
            color: white;
            text-align: center;
            padding: 22px;
            font-size: 19px;
            font-weight: bold;
            margin-top: 20px;
            text-shadow: 1px 1px black;
        }
    </style>
</head>
<body>

    <div class="top-bar">🌈 ✦ WELCOME TO OUR BEAUTIFUL SCHOOL ✦ 🌈</div>

    <div class="container">

        <div class="big-star">⭐ 🌟 ⭐ 🌟 ⭐ 🌟 ⭐</div>

        <h1>Mothercare Preparatory School</h1>
        <p class="motto">"Learning Today, Leading Tomorrow" 💛</p>

        <div class="welcome-box">
            <p style="font-size:22px; color:#1565c0; font-weight:bold;">🌸 Welcome To Our School Website! 🌸</p>
